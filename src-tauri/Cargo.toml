[package]
name = "vrc-live-caption"
version = "0.1.0"
description = "Desktop live caption tool for VRChat"
authors = ["VRC Live Caption contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vrc_live_caption_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cpal = "0.17.3"
hound = "3.5.1"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "multipart", "rustls"] }
rosc = "0.11.4"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-segmentation = "1.12.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
