[package]
name = "vrc-live-caption"
version = "0.1.0"
description = "Desktop live caption tool for VRChat"
authors = ["VRC Live Caption contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.97.1"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vrc_live_caption_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22.1"
cpal = "0.18.1"
keyring-core = "1.0.0"
mio = { version = "1.2.2", features = ["net", "os-poll"] }
rosc = "0.11.4"
# Tungstenite enables rustls transport and native roots but no crypto provider.
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
secrecy = "0.10.3"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.12.0"
zeroize = "1.8.2"
httparse = "1.10.1"
hyper-util = { version = "0.1.20", default-features = false, features = ["client-proxy"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.0", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
system-configuration = "0.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.0.0"
winhttp = { version = "0.1.3", default-features = false }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
mem_forget = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
strip = true
