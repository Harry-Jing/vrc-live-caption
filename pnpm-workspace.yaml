allowBuilds:
  esbuild: true
  lefthook: true
  vue-demi: true

# Temporary for #35: allow the just-published security fix through pnpm's
# minimum-release-age policy. Remove after nanoid 3.3.18 clears that window.
minimumReleaseAgeExclude:
  - nanoid@3.3.18

overrides:
  nanoid@<3.3.18: ^3.3.18
  # Temporary for #65: @nuxt/ui still resolves vulnerable transitive versions
  # (GHSA-cp6q-959q-f8rh, GHSA-g7r4-m6w7-qqqr). @tiptap/pm only follows
  # @tiptap/core's exact peer requirement. Remove once @nuxt/ui resolves
  # patched versions on its own.
  "@tiptap/core@<3.30.4": ^3.30.4
  "@tiptap/pm@<3.30.4": ^3.30.4
  "esbuild@>=0.27.3 <0.28.1": ^0.28.1

# Lefthook runs independent quality gates in parallel. Dependency installation
# is an explicit prerequisite so concurrent checks never mutate node_modules.
verifyDepsBeforeRun: false
