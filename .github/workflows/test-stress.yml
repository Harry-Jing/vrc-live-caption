name: Test Stress

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-stress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust_risk:
    name: Rust risk (${{ matrix.os }}, ${{ matrix.scheduling.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        scheduling:
          - name: serial
            threads: 1
          - name: high-concurrency
            threads: 8

    env:
      NEXTEST_RETRIES: 0
      PROPTEST_RNG_SEED: ${{ github.run_id }}
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            curl \
            file \
            wget \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      # Keep this version in sync with rust-toolchain.toml.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./src-tauri -> target

      - name: Install cargo-nextest
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-nextest@0.9.143
          fallback: none

      - name: Record stress environment
        shell: bash
        working-directory: src-tauri
        env:
          STRESS_COUNT: 3
          TEST_THREADS: ${{ matrix.scheduling.threads }}
        run: |
          mkdir -p target/nextest/risk-all
          {
            printf 'runner-os=%s\n' "$RUNNER_OS"
            printf 'runner-arch=%s\n' "$RUNNER_ARCH"
            printf 'image-os=%s\n' "${ImageOS:-unknown}"
            printf 'image-version=%s\n' "${ImageVersion:-unknown}"
            printf 'risk-profile=risk-all\n'
            printf '%s\n' 'risk-components=runtime,translation,loopback,timeout,cancellation,property'
            printf 'nextest-selection=--workspace --locked --profile risk-all\n'
            printf 'scheduling=%s\n' "${{ matrix.scheduling.name }}"
            printf 'nextest-test-threads=%s\n' "$TEST_THREADS"
            printf 'nextest-stress-count=%s\n' "$STRESS_COUNT"
            printf 'nextest-retries=%s\n' "$NEXTEST_RETRIES"
            printf 'proptest-rng-seed=%s\n' "$PROPTEST_RNG_SEED"
            rustc -Vv
            cargo -V
            cargo nextest --version
          } | tee target/nextest/risk-all/environment.log

      # risk-all is a union of repository-owned fake-driver, loopback, timeout,
      # cancellation, Translation, Runtime, and property/regression profiles.
      - name: Run repeated Rust risk tests
        shell: bash
        working-directory: src-tauri
        env:
          TEST_THREADS: ${{ matrix.scheduling.threads }}
        run: |
          set -o pipefail
          cargo nextest run --workspace --locked --profile risk-all \
            --retries 0 --test-threads "$TEST_THREADS" --stress-count 3 \
            2>&1 | tee target/nextest/risk-all/stress.log

      - name: Upload Rust stress evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-stress-${{ matrix.os }}-${{ matrix.scheduling.name }}
          path: |
            src-tauri/target/nextest/risk-all/junit.xml
            src-tauri/target/nextest/risk-all/*.log
          if-no-files-found: warn
          retention-days: 30

  frontend_shuffle:
    name: Frontend shuffled order
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      VITEST_SEQUENCE_SEED: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests in a reproducible shuffled order
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/frontend-stress
          {
            printf 'runner-os=%s\n' "$RUNNER_OS"
            printf 'runner-arch=%s\n' "$RUNNER_ARCH"
            printf 'image-os=%s\n' "${ImageOS:-unknown}"
            printf 'image-version=%s\n' "${ImageVersion:-unknown}"
            printf 'vitest-pool=forks\n'
            printf 'vitest-isolate=true\n'
            printf 'vitest-max-workers=4\n'
            printf 'vitest-retries=0\n'
            printf 'vitest-shuffle=true\n'
            printf 'vitest-sequence-seed=%s\n' "$VITEST_SEQUENCE_SEED"
            node --version
            pnpm --version
            pnpm exec vitest --version
          } | tee test-results/frontend-stress/environment.log
          pnpm exec vitest run --retry=0 --maxWorkers=4 \
            --sequence.shuffle.files --sequence.shuffle.tests \
            --sequence.seed="$VITEST_SEQUENCE_SEED" \
            --reporter=default --reporter=junit \
            --outputFile.junit=test-results/frontend-stress/junit.xml \
            2>&1 | tee test-results/frontend-stress/stress.log

      - name: Upload frontend stress evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-stress
          path: test-results/frontend-stress
          if-no-files-found: warn
          retention-days: 30
