name: Native Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native-build.yml"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "public/**"
      - "rust-toolchain.toml"
      - "src/**"
      - "src-tauri/**"
      - "tsconfig*.json"
      - "vite.config.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/native-build.yml"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "public/**"
      - "rust-toolchain.toml"
      - "src/**"
      - "src-tauri/**"
      - "tsconfig*.json"
      - "vite.config.ts"

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows latest
            artifact-name: windows-latest
            artifact-path: src-tauri/target/release/bundle/**
            platform: windows-latest
            args: ""
            rust-targets: ""

          - name: macOS Apple Silicon
            artifact-name: macos-aarch64
            artifact-path: src-tauri/target/aarch64-apple-darwin/release/bundle/**
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-targets: "aarch64-apple-darwin"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Keep this version in sync with rust-toolchain.toml.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97.0
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        id: tauri-build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          args: ${{ matrix.args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tauri-${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
