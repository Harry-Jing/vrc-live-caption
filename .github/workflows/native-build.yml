name: Native Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/native-build.yml"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "public/**"
      - "rust-toolchain.toml"
      - "src/**"
      - "src-tauri/**"
      - "tsconfig*.json"
      - "vite.config.ts"

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows latest
            artifact-name: windows-latest
            artifact-path: src-tauri/target/release/bundle/**
            platform: windows-latest
            args: "-- --locked"
            apple_signing_identity: ""
            rust-targets: ""

          - name: macOS Apple Silicon
            artifact-name: macos-aarch64
            artifact-path: src-tauri/target/aarch64-apple-darwin/release/bundle/**
            platform: macos-latest
            args: "--target aarch64-apple-darwin -- --locked"
            apple_signing_identity: "-"
            rust-targets: "aarch64-apple-darwin"

          # Ubuntu 22.04 provides the older glibc baseline for the AppImage.
          - name: Linux x86_64 AppImage
            artifact-name: linux-x86_64-appimage
            artifact-path: src-tauri/target/release/bundle/appimage/*.AppImage
            platform: ubuntu-22.04
            args: "--bundles appimage -- --locked"
            apple_signing_identity: ""
            rust-targets: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            curl \
            file \
            wget \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf

      - name: Set up pnpm and Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      # rustup installs the channel, profile, and components from rust-toolchain.toml.
      - name: Set up Rust
        run: rustup toolchain install

      - name: Add Rust target
        if: matrix.rust-targets != ''
        run: rustup target add ${{ matrix.rust-targets }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        id: tauri-build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
        with:
          args: ${{ matrix.args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tauri-${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  native_build_gate:
    name: Native Build Gate
    if: ${{ always() }}
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every native build to succeed
        if: needs.build.result != 'success'
        run: exit 1
