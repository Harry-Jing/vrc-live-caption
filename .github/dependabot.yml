version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      npm-non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # The pinned runtime is Node 24; bump this together with devEngines.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      cargo-patches:
        patterns: ["*"]
        update-types: ["patch"]
    ignore:
      # 0.23 is a breaking 0.x minor for a dev-facing API; revisit with the next line.
      - dependency-name: base64
        versions: ["0.23.*"]
      # 0.11 is also a breaking 0.x minor; sha2 only hashes the Chatbox regression corpus in tests.
      - dependency-name: sha2
        versions: ["0.11.*"]

  - package-ecosystem: rust-toolchain
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      actions-non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]
