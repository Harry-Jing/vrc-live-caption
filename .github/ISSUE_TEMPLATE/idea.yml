name: Idea or question
description: Suggest an improvement or ask how something works.
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: English or Chinese is fine. Please search existing issues first.

  - type: textarea
    id: request
    attributes:
      label: What would you like?
      description: >-
        For an idea, describe the problem you run into before any solution. For a question,
        say what you already tried.
    validations:
      required: true
